name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: headless suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node test/run.js
      - run: python3 scripts/package-portal.py
      - uses: actions/upload-artifact@v4
        with:
          name: phantom-arena-crazygames
          path: dist/phantom-arena-crazygames.zip

  e2e:
    name: browser end-to-end (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: xvfb-run -a node test/e2e.mjs
        env:
          PA_BROWSER: ${{ matrix.browser }}
